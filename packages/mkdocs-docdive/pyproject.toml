[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mkdocs-docdive"
dynamic = ["version"]
description = "MkDocs plugin that renders Mermaid fences as interactive docdive diagrams."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thibaud Navarre" }]
requires-python = ">=3.11"
dependencies = ["mkdocs>=1.6,<2"]
keywords = ["mkdocs", "mkdocs-plugin", "mermaid"]
classifiers = [
  "Framework :: MkDocs",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/thibaudnavarre/docdive"

[project.entry-points."mkdocs.plugins"]
docdive = "mkdocs_docdive.plugin:DocdivePlugin"

[tool.hatch.version]
path = "src/mkdocs_docdive/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mkdocs_docdive"]
