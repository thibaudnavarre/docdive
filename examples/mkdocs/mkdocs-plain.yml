# Adapter-removed variant of mkdocs.yml (no docdive plugin): deletability check.
site_name: docdive example
site_url: http://localhost/docdive/
site_dir: site-plain
docs_dir: ../../fixtures/toy
theme:
  name: material
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
