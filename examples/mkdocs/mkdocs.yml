# MkDocs Material site over the toy fixture, served under /docdive/.
site_name: docdive example
site_url: http://localhost/docdive/
docs_dir: ../../fixtures/toy
# Feeds the panel's Source link (rewritten from /edit/ to /blob/).
repo_url: https://github.com/thibaudnavarre/docdive
edit_uri: edit/main/fixtures/toy/
theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
plugins:
  - docdive:
      # Run the workspace CLI; published sites use the default `npx --yes docdive@<version>`.
      command: node ../../packages/docdive/dist/cli.js
      # The toy fixture is its own "repo": its `src/` files are copied into the site and shown inline.
      root: ../../fixtures/toy
