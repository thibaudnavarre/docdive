name: Release

# Push a tag like v0.3.0 to publish all four packages. No tokens: npm and PyPI trust this workflow through OIDC
# (trusted publishing), so each registry must list this repository and workflow file.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Tag matches every package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for f in packages/docdive-element packages/docdive packages/docusaurus-theme-docdive; do
            v="$(node -p "require('./$f/package.json').version")"
            [ "$v" = "$tag" ] || { echo "$f is $v, tag is $tag"; exit 1; }
          done
          py="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' packages/mkdocs-docdive/src/mkdocs_docdive/__init__.py)"
          [ "$py" = "$tag" ] || { echo "mkdocs-docdive is $py, tag is $tag"; exit 1; }

      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: uvx ruff check .

  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC); also signs the provenance attestation
    steps:
      - uses: actions/checkout@v7

      # No registry-url (it writes a deprecated always-auth) and no cache: this job publishes.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run build

      # Dependency order: the theme needs docdive, docdive needs the element.
      # A package already on npm is skipped, so a re-run after a partial publish finishes the rest.
      - run: |
          version="${GITHUB_REF_NAME#v}"
          for pkg in docdive-element docdive docusaurus-theme-docdive; do
            if [ "$(npm view "$pkg@$version" version 2>/dev/null)" = "$version" ]; then
              echo "$pkg@$version already published, skipping"
            else
              npm publish -w "$pkg"
            fi
          done

  publish-pypi:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: |
          uv build --out-dir dist
          uv publish --trusted-publishing always dist/*
        working-directory: packages/mkdocs-docdive
