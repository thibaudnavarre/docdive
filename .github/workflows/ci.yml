name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@v10.3.3

      - run: npm ci

      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: uvx ruff check .

      - run: npx playwright install --with-deps chromium

      - run: npm run examples:build
      - run: npm run e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
