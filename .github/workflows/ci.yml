name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@v10.3.3

      - run: npm ci

      - run: npm run build
      # Keeps docdive's own architecture docs valid (the A6 dogfood corpus) without building the site.
      - run: npm run docdive -- lint --root . --docs docs/architecture
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: uvx ruff check .

      - run: npx playwright install --with-deps chromium

      # Builds the Docusaurus and MkDocs example sites (with and without the adapter, plus host Mermaid 11) through uv.
      - run: npm run examples:build

      - run: npm run e2e
      # The MkDocs plugin test S6 reaches unpkg, so this job needs network access.
      - run: npm run e2e:ssg
      # `docusaurus start` on the example site; needs the built packages (npm run e2e builds them).
      - run: npm run e2e:dev

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
