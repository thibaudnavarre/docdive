site_name: docdive pack test
site_url: http://localhost/docdive/
docs_dir: docs
theme:
  name: material
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
plugins:
  - docdive:
      command: node {{CLI}}
